name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app.apk \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Uusin versio. Commit ${{ github.sha }}." \
            --latest
