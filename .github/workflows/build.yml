name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build store version
        if: ${{ env.RELEASE_PASSWORD != '' }}
        env:
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace && cp app/build/outputs/apk/release/app-release.apk finalapp-store.apk

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app.apk
          FILES="app.apk"; [ -f finalapp-store.apk ] && FILES="app.apk finalapp-store.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $FILES \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Uusin versio. Commit ${{ github.sha }}." \
            --latest
